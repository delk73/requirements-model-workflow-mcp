name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest scripts/test_check_text_files.py
      - name: Check text file invariants
        run: python3 scripts/check_text_files.py
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
